<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">

  <!-- Favicon -->

  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon-16x16.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
  <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
  <meta name="theme-color" content="#F5F069">

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:image" content="{{ '/assets/images/og-image.png' | absolute_url }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title }}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  <meta name="twitter:image" content="{{ '/assets/images/og-image.png' | absolute_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="{{ '/' | relative_url }}" class="logo-link">
        <img src="{{ '/assets/images/tos13-logo.png' | relative_url }}" alt="TOS13 Logo" class="logo">
      </a>
      <div class="site-title-block">
        <h1 class="site-title">TOS<span class="highlight">13</span></h1>
        <p class="site-tagline">Textile Opportunity Space 13 &mdash; a digital fieldlab for the Dutch textile ecosystem</p>
      </div>
    </div>
  </header>

  <main class="site-content">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-initiative">An initiative of
        <a href="https://www.tue.nl/en/our-university/departments/industrial-design/" target="_blank" rel="noopener">TU/e Industrial Design</a>,
        <a href="https://newtexeco.nl/en/home/" target="_blank" rel="noopener">NewTexEco</a> &amp;
        <a href="https://textiellab.nl/en" target="_blank" rel="noopener">TextielLab Tilburg</a>
      </p>
      <p class="footer-supported">Research supported by <a href="https://www.clicknl.nl/en/" target="_blank" rel="noopener">CLICKNL</a></p>
      <p>&copy; {{ 'now' | date: "%Y" }} Textile Opportunity Space 13</p>
    </div>
  </footer>

</body>
</html>
