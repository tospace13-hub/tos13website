<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1A1A1A" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#E87A1E" stroke-width="3" />

  <!-- Textile weave pattern (simplified) -->
  <g opacity="0.15" stroke="#E87A1E" stroke-width="2" fill="none">
    <line x1="40" y1="30" x2="40" y2="170" />
    <line x1="60" y1="30" x2="60" y2="170" />
    <line x1="80" y1="30" x2="80" y2="170" />
    <line x1="100" y1="30" x2="100" y2="170" />
    <line x1="120" y1="30" x2="120" y2="170" />
    <line x1="140" y1="30" x2="140" y2="170" />
    <line x1="160" y1="30" x2="160" y2="170" />
    <line x1="30" y1="40" x2="170" y2="40" />
    <line x1="30" y1="60" x2="170" y2="60" />
    <line x1="30" y1="80" x2="170" y2="80" />
    <line x1="30" y1="100" x2="170" y2="100" />
    <line x1="30" y1="120" x2="170" y2="120" />
    <line x1="30" y1="140" x2="170" y2="140" />
    <line x1="30" y1="160" x2="170" y2="160" />
  </g>

  <!-- TOS text -->
  <text x="100" y="88" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF" letter-spacing="-1">TOS</text>

  <!-- 13 text in orange -->
  <text x="100" y="138" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#E87A1E" letter-spacing="-2">13</text>

  <!-- Small accent line -->
  <line x1="65" y1="96" x2="135" y2="96" stroke="#E87A1E" stroke-width="2" />
</svg>
